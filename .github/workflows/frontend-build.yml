name: frontend-build

# Verifies the React + Vite dashboard still builds cleanly on every PR.
# Catches broken imports, type errors, and dependency drift in the webapp
# that would otherwise only surface on local `npm run dev`.

on:
  push:
    branches: [main, oad-integration]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-build.yml'
  pull_request:
    branches: [main, oad-integration]
    paths:
      - 'frontend/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        # `npm ci` is the reproducible path (requires package-lock.json).
        # If the lockfile is somehow missing, fall back to `npm install` so the
        # build can still proceed — this should rarely fire since the lockfile
        # is tracked, but it keeps CI resilient against accidental .gitignore
        # additions.
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "::warning::frontend/package-lock.json missing — falling back to 'npm install'. Commit the lockfile for reproducible CI."
            npm install
          fi

      - name: Lint
        run: npm run lint --if-present

      - name: Build production bundle
        run: npm run build
