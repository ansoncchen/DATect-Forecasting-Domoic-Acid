# Tool configuration only. Dependencies live in requirements.txt (runtime)
# and requirements-dev.txt (tests, linting, figure scripts); the repo is run
# from source rather than installed as a package.

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
