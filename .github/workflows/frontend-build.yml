name: frontend-build

# Verifies the React + Vite dashboard lints and builds cleanly on every PR.
# Catches broken imports, lint regressions, and dependency drift in the webapp
# that would otherwise only surface on local `npm run dev`.

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        # `npm install` rather than `npm ci`: the lockfile is generated on macOS
        # and only records Rollup's optionalDependencies for that platform, so
        # `npm ci` fails on Linux runners (https://github.com/npm/cli/issues/4828).
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Build production bundle
        run: npm run build
