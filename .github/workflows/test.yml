name: tests

# Runs the regression-test suite on every PR and push to main.
# Catches drift between config/tuned_hyperparameters.json and runtime code,
# leakage-audit failures, API regressions, and per-site config schema changes.
# Tests run on the Python and model-library versions every reported number and the
# Docker image use (Hyak's env: Python 3.10 under constraints.txt), not the newest
# releases: pandas 3 reads parquet strings as a different dtype, for example.

on:
  push:
    branches: [main]
    paths-ignore: ['paper*/**', 'papers/**', 'docs/**', '**.md']
  pull_request:
    branches: [main]
    paths-ignore: ['paper*/**', 'papers/**', 'docs/**', '**.md']

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt -c constraints.txt

      - name: Run tests
        run: pytest tests/ -q --tb=short
