name: frontend-build

# Verifies the React + Vite dashboard still builds cleanly on every PR.
# Catches broken imports, type errors, and dependency drift in the webapp
# that would otherwise only surface on local `npm run dev`.

on:
  push:
    branches: [main, oad-integration]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-build.yml'
  pull_request:
    branches: [main, oad-integration]
    paths:
      - 'frontend/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        # Use `npm install` (not `npm ci`) so platform-specific optional
        # dependencies resolve correctly. The lockfile is generated on the
        # developer's local machine (often macOS), so it only records the
        # Rollup optionalDependencies for that platform. `npm ci` then fails
        # on Linux runners with "Missing: @rollup/rollup-linux-x64-gnu from
        # lock file". `npm install` honors version constraints from the
        # lockfile while still resolving missing optional deps for the
        # current platform. See https://github.com/npm/cli/issues/4828.
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint --if-present

      - name: Build production bundle
        run: npm run build
