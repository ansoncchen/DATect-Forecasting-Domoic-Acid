name: frontend-build

# Verifies the React + Vite dashboard lints and builds cleanly on every PR.
# Catches broken imports, lint regressions, and dependency drift in the webapp
# that would otherwise only surface on local `npm run dev`.

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        # The lockfile records every platform's Rollup binary, so `npm ci`
        # installs exactly what is locked on Linux too.
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Build production bundle
        run: npm run build
